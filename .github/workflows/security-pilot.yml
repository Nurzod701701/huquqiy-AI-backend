name: QOMUS Security Pilot Checks
on:
  push:
    branches:
      - security/qomus-hardening-demo-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --check security-hardening.js
      - run: node --check security-alerts.js
      - run: node --check secure-vault.js
      - run: node --check ai-privacy.js
      - run: node --check database/neon-encrypted-store.js
      - run: node --check test/neon-encrypted-store.test.js
      - run: npm run test:security
