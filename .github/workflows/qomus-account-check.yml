name: QOMUS account checks
on:
  pull_request:
    paths:
      - server.js
      - .github/workflows/qomus-account-check.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
