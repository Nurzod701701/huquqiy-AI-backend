name: QOMUS Functional QA Regression
on:
  pull_request:
    paths:
      - 'server.js'
      - 'advokat-pro.js'
      - 'test/functional-calculators-regression.test.js'
      - 'test/advocate-document-export-regression.test.js'
      - 'test/functional-http-smoke.test.js'
      - 'public-judgments.js'
      - 'test/public-judgments-stream-limit.test.js'
      - 'test/ai-quality-offline-regression.test.js'
      - 'package.json'
      - '.github/workflows/qomus-functional-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server.js
      - run: node --check advokat-pro.js
      - run: npm run test:functional-qa
      - run: node --test test/public-judgments-stream-limit.test.js
      - run: node --test test/ai-quality-offline-regression.test.js
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm run test:functional-http
