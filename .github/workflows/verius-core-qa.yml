name: VERIUS Core QA
on:
  push:
    branches:
      - qa/verius-core-strengthening-20261110
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:core
