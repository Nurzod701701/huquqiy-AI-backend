name: VERIUS Password Recovery QA
on:
  pull_request:
    paths:
      - 'server.js'
      - 'test/password-reset-delivery.test.js'
      - '.github/workflows/verius-password-recovery-qa.yml'
  push:
    branches:
      - fix/verius-password-reset-rebase-20261117
jobs:
  password-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: node --check server.js
      - name: Password recovery regression
        run: node --test test/password-reset-delivery.test.js
      - name: Security regression
        run: npm run test:security
      - name: Citizen regression
        run: npm run test:core
