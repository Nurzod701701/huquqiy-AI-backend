name: VERIUS Browser Visual QA
on:
  push:
    branches:
      - design/verius-navigation-a11y-20261111
    paths:
      - server.js
      - scripts/verius-visual-smoke.cjs
      - .github/workflows/verius-browser-qa.yml
  pull_request:
    branches: [main]
    paths:
      - server.js
      - scripts/verius-visual-smoke.cjs
      - .github/workflows/verius-browser-qa.yml
  workflow_dispatch:

jobs:
  chromium-visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright smoke
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Run desktop, tablet and phone browser checks
        run: node scripts/verius-visual-smoke.cjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verius-browser-screenshots
          path: artifacts/verius-visual/
          if-no-files-found: warn
          retention-days: 7
